# Borsa Sinyal - Flutter App
name: borsa_sinyal
description: BIST haber tabanlı yön tahmin uygulaması
version: 2.0.0+2

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Routing
  go_router: ^14.2.0

  # Local Database
  isar: ^3.1.0+1
  isar_flutter_libs: ^3.1.0+1
  path_provider: ^2.1.3

  # Settings / Preferences
  shared_preferences: ^2.2.3

  # Network
  dio: ^5.5.0+1
  pretty_dio_logger: ^1.3.1

  # Serialization
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # Date/Time
  intl: ^0.18.0

  # Utilities
  equatable: ^2.0.5
  uuid: ^4.4.0
  logger: ^2.3.0

  # UI
  flutter_colorpicker: ^1.1.0
  fl_chart: ^0.68.0
  pull_to_refresh_flutter3: ^2.0.1

  # Export/Import
  file_picker: ^8.0.5
  permission_handler: ^11.3.1

  # WebView
  webview_flutter: ^4.7.0

  # Wake Lock
  wakelock_plus: ^1.2.0

  # Share
  share_plus: ^10.0.0

  # URL Launcher
  url_launcher: ^6.2.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.11
  riverpod_generator: ^2.4.0
  freezed: ^2.5.2
  json_serializable: ^6.8.0
  isar_generator: ^3.1.0+1
  custom_lint: ^0.6.4
  riverpod_lint: ^2.3.10

flutter:
  uses-material-design: true
  assets:
    - assets/images/
